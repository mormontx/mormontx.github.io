<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" fill="none" role="img" aria-label="Archival facsimile — Draft 02 margin crop: instructor's pencil question 'why here?' with a smaller student reply beneath">
  <title>Archival facsimile — Draft 02 margin crop: instructor's pencil question answered beneath</title>

  <!-- paper -->
  <rect x="80" y="60" width="640" height="400" fill="#F9F8F6" stroke="#1A1A1A" stroke-width="0.75"/>

  <!-- faint notebook ruling -->
  <g stroke="#1A1A1A" stroke-width="0.5" opacity="0.12">
    <line x1="80" y1="88" x2="720" y2="88"/>
    <line x1="80" y1="110" x2="720" y2="110"/>
    <line x1="80" y1="132" x2="720" y2="132"/>
    <line x1="80" y1="154" x2="720" y2="154"/>
    <line x1="80" y1="176" x2="720" y2="176"/>
    <line x1="80" y1="198" x2="720" y2="198"/>
    <line x1="80" y1="220" x2="720" y2="220"/>
    <line x1="80" y1="242" x2="720" y2="242"/>
    <line x1="80" y1="264" x2="720" y2="264"/>
    <line x1="80" y1="286" x2="720" y2="286"/>
    <line x1="80" y1="308" x2="720" y2="308"/>
    <line x1="80" y1="330" x2="720" y2="330"/>
    <line x1="80" y1="352" x2="720" y2="352"/>
    <line x1="80" y1="374" x2="720" y2="374"/>
    <line x1="80" y1="396" x2="720" y2="396"/>
    <line x1="80" y1="418" x2="720" y2="418"/>
    <line x1="80" y1="440" x2="720" y2="440"/>
  </g>

  <!-- text-column / margin division -->
  <line x1="528" y1="60" x2="528" y2="460" stroke="#1A1A1A" stroke-width="0.5" opacity="0.25"/>

  <!-- printed body text: one continuous bar per line, ragged right -->
  <g fill="#3A3733" opacity="0.62">
    <rect x="112" y="150" width="412" height="2.6"/>
    <rect x="112" y="168" width="356" height="2.6"/>
    <rect x="112" y="186" width="465" height="2.6"/>
    <rect x="112" y="204" width="388" height="2.6"/>
    <rect x="112" y="222" width="442" height="2.6"/>
    <rect x="112" y="240" width="337" height="2.6"/>
    <rect x="112" y="258" width="470" height="2.6"/>
    <rect x="112" y="276" width="371" height="2.6"/>
    <rect x="112" y="294" width="428" height="2.6"/>
    <rect x="112" y="312" width="349" height="2.6"/>
  </g>

  <!-- page number -->
  <text x="712" y="452" fill="#1A1A1A" opacity="0.6" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9" text-anchor="end">2</text>

  <!-- instructor's pencil question -->
  <text x="540" y="150" font-family="'Bradley Hand', 'Snell Roundhand', 'Segoe Script', cursive" font-size="19" fill="#55504A" transform="rotate(-2 540 150)">why here?</text>

  <!-- student's reply, smaller and tighter -->
  <text x="540" y="205" font-family="'Bradley Hand', 'Snell Roundhand', 'Segoe Script', cursive" font-size="13.5" fill="#5B564F" transform="rotate(-1 540 205)">because the argument moves —</text>

  <!-- accent arrow: student reply -> phrase in body -->
  <g>
    <path d="M 690 214 C 640 218 560 216 500 210 C 472 207 456 206 448 206" stroke="#A85D6B" stroke-width="1" stroke-opacity="0.6" fill="none" stroke-linecap="round"/>
    <path d="M 432 206 L 446 210 L 446 202 Z" fill="#A85D6B" fill-opacity="0.6"/>
  </g>

  <!-- photographic crop marks -->
  <g stroke="#1A1A1A" stroke-width="0.75" opacity="0.85" fill="none" stroke-linecap="square">
    <path d="M 22 40 L 22 22 L 40 22"/>
    <path d="M 778 40 L 778 22 L 760 22"/>
    <path d="M 22 480 L 22 498 L 40 498"/>
    <path d="M 778 480 L 778 498 L 760 498"/>
  </g>

  <!-- captions -->
  <text x="20" y="510" fill="#6E6A63" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" text-anchor="start">ARCHIVAL FACSIMILE — DRAFT 02, MARGIN CROP</text>
  <text x="780" y="510" fill="#6E6A63" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="9.5" text-anchor="end">SCALE 1:1 · GRAPHITE ON 90GSM</text>
</svg>
